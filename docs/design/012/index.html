<!doctype html>
<html lang="uk" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Shopik — макет 012</title>
  <style>
    /* Proposed design tokens; kept outside the application until approval. */
    :root { color-scheme:light; --page:#f6f5f1; --surface:#ffffff; --soft:#eeefea; --text:#202821; --muted:#626a63; --line:#e1e4dc; --control:#7a847b; --accent:#f7a51a; --accent-end:#ffb83e; --accent-text:#302008; --ink:#27372c; --on-ink:#ffffff; --danger:#ad3637; --danger-soft:#fff0ee; --focus:#9c5600; --shadow:0 12px 28px #20282106; --tag-lime:#deedbf; --tag-lilac:#e9e0f7; --tag-peach:#ffe2c9; --tag-blue:#dce9f5; --tag-text:#29332a; }
    :root[data-theme="dark"] { color-scheme:dark; --page:#151a17; --surface:#202721; --soft:#2b332c; --text:#f0f2eb; --muted:#b0baaf; --line:#3b453b; --control:#929f93; --accent:#f7a51a; --accent-end:#ffb83e; --accent-text:#302008; --ink:#e3ebda; --on-ink:#202821; --danger:#ffacab; --danger-soft:#40282a; --focus:#ffc667; --shadow:0 12px 28px #00000012; --tag-lime:#deedbf; --tag-lilac:#e9e0f7; --tag-peach:#ffe2c9; --tag-blue:#dce9f5; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--page); color:var(--text); font:15px/1.5 "Segoe UI",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
    button,input,select { font:inherit; }
    button,a,summary { -webkit-tap-highlight-color:transparent; }
    button { cursor:pointer; color:inherit; }
    a { color:inherit; }
    button:disabled { cursor:not-allowed; opacity:.48; box-shadow:none; }
    button:focus-visible,a:focus-visible,summary:focus-visible,select:focus-visible { outline:3px solid var(--focus); outline-offset:4px; }
    button:active:not(:disabled) { transform:translateY(1px); }
    svg { display:block; width:20px; height:20px; flex-shrink:0; }
    h1,h2,h3,p { margin:0; }
    .review-bar { padding:9px 24px; text-align:center; background:var(--ink); color:var(--on-ink); font-size:12px; letter-spacing:.02em; }
    .review-bar span { opacity:.8; }
    .topbar { border-bottom:1px solid var(--line); background:var(--surface); }
    .topbar-inner { max-width:1160px; min-height:88px; padding:16px 32px; margin:auto; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { font-size:27px; font-weight:750; letter-spacing:-1.3px; display:flex; align-items:center; gap:10px; }
    .brand-mark { width:36px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--accent); color:var(--accent-text); }
    .brand-mark svg { width:23px; height:23px; }
    .navigation { display:flex; align-items:center; gap:6px; }
    .nav-link { display:flex; align-items:center; justify-content:center; gap:9px; min-height:44px; border:0; background:none; padding:10px 17px; border-radius:12px; color:var(--muted); font-weight:600; }
    .nav-link[aria-current="page"] { background:var(--soft); color:var(--text); }
    .account-area { display:flex; align-items:center; gap:12px; }
    .theme-toggle { width:44px; height:44px; border-radius:50%; background:none; border:1px solid var(--line); display:grid; place-items:center; }
    .account { display:flex; align-items:center; gap:9px; border:0; background:none; min-height:44px; padding:0; font-weight:600; }
    .avatar { width:36px; height:36px; border-radius:50%; background:#d9e5cd; color:#34472d; display:inline-grid; place-items:center; font-size:12px; font-weight:700; flex-shrink:0; }
    .avatar.small { width:19px; height:19px; font-size:8px; }
    .avatar.alternate { background:#ede0d3; color:#65462e; }
    .page { max-width:1160px; padding:38px 32px 60px; margin:0 auto; }
    .page-intro { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:30px; }
    .eyebrow { font-size:11px; letter-spacing:.14em; font-weight:750; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
    h1 { font-size:38px; line-height:1.2; letter-spacing:-1.5px; font-weight:730; }
    .subtitle { color:var(--muted); margin-top:9px; }
    .workspace-pill { display:flex; align-items:center; gap:8px; padding:10px 14px; border:1px solid var(--line); border-radius:12px; font-size:13px; background:var(--surface); white-space:nowrap; }
    .workspace-pill svg { width:16px; height:16px; }
    .layout { display:grid; grid-template-columns:238px minmax(0,1fr); align-items:start; gap:32px; }
    .sidebar { min-width:0; }
    .filter-panel { background:var(--surface); border:1px solid var(--line); padding:21px; border-radius:20px; }
    .filter-title { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    h2 { font-size:18px; font-weight:700; letter-spacing:-.4px; }
    .text-button { font-size:12px; color:var(--muted); border:0; background:none; min-height:44px; padding:0 2px; text-decoration:underline; text-underline-offset:3px; }
    .filter-label { font-size:11px; font-weight:650; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:16px 0 10px; }
    .selected-tags { min-height:68px; border:1px dashed var(--control); padding:9px; border-radius:12px; display:flex; flex-wrap:wrap; gap:6px; align-content:start; }
    .empty-hint { padding:6px 2px; font-size:12px; color:var(--muted); }
    .filter-tags { display:flex; flex-wrap:wrap; gap:6px; }
    .tag { display:inline-flex; align-items:center; justify-content:center; gap:5px; padding:3px 9px; border-radius:7px; font-size:11px; line-height:1.5; font-weight:650; color:var(--tag-text); background:var(--tag-lime); max-width:100%; overflow-wrap:anywhere; }
    button.tag { min-height:44px; border:0; padding:8px 10px; font-size:12px; border-radius:10px; }
    .tag svg { width:12px; height:12px; }
    .tag.lilac { background:var(--tag-lilac); } .tag.peach { background:var(--tag-peach); } .tag.blue { background:var(--tag-blue); }
    .filter-note { font-size:12px; line-height:1.7; color:var(--muted); margin-top:17px; }
    .sidebar-note { display:flex; gap:8px; padding:17px 6px; color:var(--muted); font-size:12px; }
    .sidebar-note svg { width:16px; height:16px; margin-top:2px; }
    .content { min-width:0; }
    .categories { display:flex; gap:8px; overflow-x:auto; padding:0 0 14px; margin-bottom:0; scrollbar-width:thin; }
    .category { min-height:44px; padding:10px 18px; border:1px solid var(--line); background:transparent; border-radius:12px; font-weight:600; white-space:nowrap; flex-shrink:0; font-size:13px; }
    .category[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:var(--on-ink); }
    .list-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 1px; }
    .count { color:var(--muted); font-size:12px; font-weight:450; margin-left:8px; }
    .list-caption { color:var(--muted); font-size:12px; display:flex; gap:6px; align-items:center; }
    .list-caption svg { width:14px; height:14px; }
    .sticky-add { position:sticky; top:0; z-index:5; background:var(--page); padding:0 0 15px; }
    .button { border:1px solid transparent; border-radius:13px; min-height:48px; padding:12px 20px; font-size:14px; line-height:1.5; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:10px; text-decoration:none; }
    .button.primary { background:linear-gradient(110deg,var(--accent),var(--accent-end)); color:var(--accent-text); box-shadow:0 5px 12px #e994131c; }
    .button.neutral { background:var(--ink); color:var(--on-ink); }
    .button.secondary { background:var(--surface); border-color:var(--control); }
    .button.danger { background:var(--danger-soft); color:var(--danger); border-color:var(--danger); }
    .button.wide { width:100%; }
    .button:hover:not(:disabled) { filter:brightness(.97); }
    .product-list { margin:0; padding:0 22px; list-style:none; border:1px solid var(--line); border-radius:22px; background:var(--surface); box-shadow:var(--shadow); }
    .product { padding:20px 0; display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:14px; align-items:start; border-bottom:1px solid var(--line); }
    .product:last-child { border-bottom:0; }
    .product-symbol { width:44px; height:48px; border-radius:13px; background:var(--soft); display:grid; place-items:center; color:var(--muted); }
    .product-info { min-width:0; }
    .product h3 { font-size:15px; line-height:1.5; font-weight:650; overflow-wrap:anywhere; }
    .product-description { font-size:12px; color:var(--muted); margin-top:2px; }
    .product-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
    .author { display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:10px; color:var(--muted); margin-top:10px; }
    .price { font-size:16px; font-weight:730; white-space:nowrap; font-variant-numeric:tabular-nums; letter-spacing:-.3px; }
    .price small { font-size:11px; font-weight:500; color:var(--muted); margin-left:3px; }
    .product-end { text-align:right; }
    .row-actions { display:flex; justify-content:end; margin-top:8px; gap:2px; }
    .icon-button,.menu summary { width:44px; height:44px; border-radius:11px; border:1px solid transparent; background:none; display:flex; align-items:center; justify-content:center; color:var(--muted); }
    .icon-button.complete { border-color:var(--control); color:var(--text); }
    .icon-button:hover,.menu summary:hover { background:var(--soft); }
    .menu { position:relative; }
    .menu summary { cursor:pointer; list-style:none; }
    .menu summary::-webkit-details-marker { display:none; }
    .menu[open] .menu-content { position:absolute; z-index:7; right:0; top:47px; width:166px; padding:5px; background:var(--surface); border:1px solid var(--control); border-radius:13px; box-shadow:0 8px 25px #00000015; }
    .menu-content button { display:flex; gap:9px; align-items:center; min-height:44px; width:100%; padding:8px; background:none; border:0; border-radius:8px; text-align:left; font-size:13px; }
    .menu-content button:hover { background:var(--soft); }
    .menu-content .delete { color:var(--danger); }
    .pending { display:flex; align-items:center; gap:5px; font-size:10px; color:var(--muted); justify-content:end; margin-top:9px; }
    .pending-dot { width:5px; height:5px; background:var(--accent); border-radius:50%; }
    .empty { border:1px dashed var(--control); border-radius:22px; padding:38px 24px; text-align:center; color:var(--muted); }
    .empty h3 { color:var(--text); margin-bottom:6px; }
    .footnote { display:flex; align-items:center; justify-content:center; gap:6px; font-size:11px; color:var(--muted); margin:17px 0; }
    .footnote svg { width:14px; height:14px; }
    .month-picker { display:flex; gap:8px; align-items:center; }
    .month-picker select { min-height:44px; border:1px solid var(--control); border-radius:12px; background:var(--surface); color:var(--text); padding:9px 14px; }
    .analytics-card { background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:24px; }
    .analytics-heading { display:flex; justify-content:space-between; gap:10px; }
    .analytics-heading p { color:var(--muted); font-size:12px; margin-top:4px; }
    .period-badge { font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:7px; padding:4px 8px; align-self:start; white-space:nowrap; }
    .chart-layout { display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:28px; margin-top:22px; }
    .donut { position:relative; width:100%; max-width:254px; aspect-ratio:1; margin:auto; }
    .donut svg { width:100%; height:100%; transform:rotate(-90deg); }
    .donut circle { fill:none; stroke-width:19; }
    .donut-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .donut-value { font-size:28px; font-weight:750; letter-spacing:-1px; }
    .donut-unit { font-size:12px; color:var(--muted); margin-top:-1px; }
    .donut-caption { color:var(--muted); font-size:11px; margin-top:10px; text-align:center; max-width:150px; }
    .legend { display:flex; flex-direction:column; gap:20px; list-style:none; margin:0; padding:0; }
    .legend-item { display:grid; grid-template-columns:9px minmax(0,1fr) auto; align-items:start; gap:9px; }
    .legend-dot { width:8px; height:8px; border-radius:50%; margin-top:6px; }
    .legend-label { font-size:13px; } .legend-label small { display:block; color:var(--muted); font-size:11px; margin-top:3px; }
    .legend-amount { font-size:13px; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; }
    .chart-note { font-size:11px; color:var(--muted); border-top:1px solid var(--line); margin-top:22px; padding-top:14px; }
    .expense-list { margin-top:26px; }
    .settings-grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
    .settings-card { border:1px solid var(--line); background:var(--surface); border-radius:20px; padding:24px; min-width:0; }
    .settings-card p { color:var(--muted); margin-top:9px; font-size:13px; }
    .settings-card .button { margin-top:20px; }
    .theme-samples { display:flex; gap:10px; margin-top:18px; }
    .theme-sample { min-height:70px; flex:1; border:1px solid var(--control); border-radius:12px; padding:14px; }
    .theme-sample.light { background:#f6f5f1; color:#202821; } .theme-sample.dark { background:#202721; color:#f0f2eb; }
    .specimen { margin-top:48px; padding-top:25px; border-top:1px solid var(--line); }
    .specimen-heading { display:flex; align-items:center; justify-content:space-between; }
    .specimen-heading p { font-size:12px; color:var(--muted); }
    .specimen-body { padding-top:18px; display:flex; flex-wrap:wrap; align-items:start; gap:12px; }
    .specimen-item { display:flex; flex-direction:column; gap:7px; align-items:start; }
    .specimen-item small { font-size:10px; color:var(--muted); }
    .design-footer { max-width:1160px; padding:0 32px 30px; margin:auto; display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; font-size:11px; color:var(--muted); }
    dialog { border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:22px; padding:26px; width:min(420px,calc(100% - 32px)); box-shadow:0 20px 70px #00000028; }
    dialog::backdrop { background:#17221a66; backdrop-filter:blur(3px); }
    dialog p { margin:12px 0 20px; color:var(--muted); font-size:14px; }
    [hidden] { display:none !important; }
    @media(min-width:1100px) { .product { padding:22px 0; } }
    @media(max-width:800px) { .layout { grid-template-columns:190px minmax(0,1fr); gap:22px; } .page,.topbar-inner { padding-left:24px; padding-right:24px; } .filter-panel { padding:16px; } .account-name { display:none; } .navigation { gap:0; } .nav-link { padding:10px 12px; } .chart-layout { grid-template-columns:1fr; } .legend { gap:14px; } .product-list { padding:0 16px; } .product { grid-template-columns:36px minmax(0,1fr) auto; gap:10px; } .product-symbol { width:36px; height:42px; } }
    @media(max-width:600px) { .review-bar { padding:7px 12px; font-size:10px; } .review-bar span { display:none; } .topbar-inner { min-height:70px; flex-wrap:wrap; gap:14px; padding:13px 20px 0; } .brand { font-size:25px; } .brand-mark { width:32px; height:35px; border-radius:10px; } .account-area { gap:10px; } .theme-toggle { width:44px; height:44px; } .navigation { order:3; width:100%; justify-content:start; gap:14px; border-top:1px solid var(--line); padding:7px 0; } .nav-link { min-height:44px; padding:9px 13px; font-size:13px; } .nav-link svg { width:17px; height:17px; } .page { padding:25px 20px 32px; } .page-intro { margin-bottom:21px; align-items:start; } h1 { font-size:31px; letter-spacing:-1.1px; } .subtitle { font-size:13px; margin-top:7px; } .eyebrow { font-size:10px; } .workspace-pill { display:none; } .layout { display:flex; flex-direction:column; gap:19px; } .sidebar,.content { width:100%; } .filter-panel { padding:15px 16px; border-radius:17px; } .filter-label { margin-top:9px; font-size:10px; } .selected-tags { min-height:44px; padding:5px 7px; } .empty-hint { font-size:11px; padding:5px 2px; } .filter-tags { gap:5px; } button.tag { padding:8px 10px; } .filter-note { margin-top:10px; font-size:11px; } .sidebar-note { display:none; } .category { padding:10px 15px; font-size:12px; border-radius:11px; } .categories { padding-bottom:9px; } .list-toolbar { padding:12px 0; } .list-caption { display:none; } .product { grid-template-columns:34px minmax(0,1fr) auto; gap:9px; padding:18px 0; } .product-symbol { width:34px; height:40px; border-radius:10px; } .product-symbol svg { width:18px; height:18px; } .product h3 { font-size:14px; } .product-description { font-size:11px; } .price { font-size:14px; } .price small { font-size:10px; margin-left:1px; } .product-list { padding:0 13px; border-radius:18px; } .author { font-size:9px; gap:4px; } .tag { font-size:10px; padding:3px 7px; } .price.large { white-space:normal; max-width:100px; overflow-wrap:anywhere; } .row-actions { gap:0; } .icon-button,.menu summary { width:44px; height:44px; } .pending { font-size:9px; max-width:84px; } .analytics-card { padding:20px; } .chart-layout { grid-template-columns:1fr; gap:24px; } .donut { max-width:240px; } .month-picker { margin-top:16px; } .page-intro.expenses-intro { flex-direction:column; gap:0; } .settings-grid { grid-template-columns:1fr; gap:16px; } .settings-card { padding:20px; } .specimen { margin-top:30px; } .specimen-heading { align-items:start; gap:10px; } .specimen-heading h2 { font-size:16px; } .specimen-heading p { font-size:10px; max-width:130px; text-align:right; } .design-footer { padding:0 20px 25px; font-size:10px; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; animation:none !important; } }
  </style>
</head>
<body>
  <!-- Review context is separate from the proposed application UI. -->
  <div class="review-bar">Концепція 012 · макет для погодження <span>— умовні дані, без підключення до Supabase</span></div>
  <header class="topbar"><div class="topbar-inner">
    <div class="brand"><span class="brand-mark" data-icon="bag"></span>shopik<span style="color:var(--accent)">.</span></div>
    <nav class="navigation" aria-label="Сторінки макета">
      <button class="nav-link" data-page="shopping" aria-current="page"><span data-icon="list"></span>Список покупок</button>
      <button class="nav-link" data-page="expenses"><span data-icon="chart"></span>Витрати</button>
    </nav>
    <div class="account-area"><button class="theme-toggle" id="theme-toggle" aria-label="Увімкнути темну тему"><span data-icon="moon"></span></button><button class="account" data-page="settings" aria-label="Налаштування акаунта"><span class="account-name">Олексій</span><span class="avatar" aria-hidden="true">ОЛ</span></button></div>
  </div></header>
  <!-- Screens share a responsive shell; demonstration data never reach the app. -->
  <main class="page" id="screen"></main>
  <footer class="design-footer"><span>SHOPIK · Концепція інтерфейсу 01</span><span>Картки — референс 1 · Кнопки — референс 2</span></footer>
  <dialog id="preview-dialog" aria-labelledby="dialog-heading"><h2 id="dialog-heading">Попередній вигляд</h2><p id="dialog-description"></p><form method="dialog"><button class="button neutral wide">Зрозуміло</button></form></dialog>
  <script type="module" src="preview.js"></script>
</body>
</html>
